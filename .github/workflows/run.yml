name: AutoShorts AI Test
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install FFmpeg, Libass & Custom Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-montserrat fonts-roboto fonts-freefont-ttf
          fc-cache -f -v

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📁 Create Asset Folders
        run: |
          mkdir -p assets/audio_clips
          mkdir -p assets/video_clips
          mkdir -p assets/temp
          mkdir -p assets/final
          mkdir -p assets/avatar

      - name: 🚀 Run AutoShorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py 

      - name: 📤 Upload Output Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            assets/final/**
            script.json

      - name: 📜 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            assets/audio_clips/**
            assets/video_clips/**
            assets/temp/**
